<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Grabber fixture gallery</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  .hero { width: 200px; height: 120px; background-image: url('img/400x300.png'); background-size: cover; }
  .banner { width: 200px; height: 120px; background-image: url('img/500x400.png'); background-size: cover; }
</style>
</head>
<body>
<h1>fixture gallery</h1>
<!--
  Read this before editing: scripts/verify-e2e.js asserts exact counts from
  test/fixtures/expected.js against this file.

  * img/300x200.jpg is served as PNG bytes on purpose (see server.js).
  * img/400x300.png appears three times - twice as <img>, once as a background - so
    the gate can prove core dedupe collapses it into one item at its largest size.
  * .hero and .banner have no intrinsic size at scan time, so the popup has to probe
    them. That is what lets the 500x400 background pass a min-width filter.
  * Totals: 6 <img> + 2 backgrounds = 8 raw candidates, 6 unique images.
-->
<img src="img/400x300.png" alt="big landscape">
<img src="img/300x200.jpg" alt="medium, jpg named">
<img src="img/120x90.png" alt="small">
<img src="img/64x64.png" alt="tiny">
<img src="img/400x300.png" alt="big landscape again">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt="inline pixel">
<div class="hero"></div>
<div class="banner"></div>
</body>
</html>
