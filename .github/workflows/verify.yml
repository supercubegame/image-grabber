name: verify

# Push-only on purpose: a pull_request trigger would double every run, and the
# report job finds the PR from the commit anyway.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # continue-on-error so the report still uploads; the job is failed below.
      #
      # stdout is teed to a file because it is the only evidence that survives a gate
      # that dies before writing its report - and the CI log itself is not something
      # the agent reading the posted comment can open. pipefail keeps the step's
      # outcome tied to node's exit code rather than tee's.
      - name: run fast gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify.js 2>&1 | tee test/artifacts/stdout-fast.log
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-fast
          path: test/artifacts/
          if-no-files-found: error
      - name: fail if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1

  e2e:
    name: browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: cache chrome download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: install
        run: npm install --no-audit --no-fund
      - name: run browser gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify-e2e.js 2>&1 | tee test/artifacts/stdout-e2e.log
      - name: upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-e2e
          path: test/artifacts/
          if-no-files-found: error
      - name: fail if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # ==========================================================================
  # The report job does not live here. It is one file in supercubegame/ci-workflows,
  # and supercubegame/jumpwow calls the same one.
  #
  # It used to be a byte-identical copy in both repos, and nothing guarded that:
  # each repo's gate can only see its own workflow, so editing both stays green
  # while the two quietly diverge. One file removes the question entirely.
  #
  # Everything that job does the way it does - no checkout, fallback comment seeded
  # first, retries on the fetch and the post, a degraded report that says so - is
  # explained in the header of that file. Short version: run #51 had both gates
  # green and posted nothing, because the clone died on a TLS error.
  #
  # The fast gate asserts the `uses:` line below, that this job never grows its own
  # `steps:` back, and that `gates:` carries the REAL needs.*.result.
  # ==========================================================================
  summary:
    name: report
    if: always()
    needs: [fast, e2e]
    permissions:
      contents: write
      pull-requests: write
    uses: supercubegame/ci-workflows/.github/workflows/report.yml@main
    with:
      node-version: '20'
      gates: '[{"name":"fast gate","result":"${{ needs.fast.result }}"},{"name":"browser gate","result":"${{ needs.e2e.result }}"}]'
      composer-files: scripts/compose-report.js scripts/lib/report.js
      composer-entry: scripts/compose-report.js
      marker: '<!-- image-grabber-verify -->'
      # No checkout means no root package.json, and node would parse these ESM
      # files as CommonJS. The .mjs projects do not need this.
      esm-shim: scripts/package.json
