name: verify

# Push-only on purpose: a pull_request trigger would double every run, and the
# summary job finds the PR from the commit anyway.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # continue-on-error so the report still uploads; the job is failed below.
      #
      # stdout is teed to a file because it is the only evidence that survives a gate
      # that dies before writing its report - and the CI log itself is not something
      # the agent reading the posted comment can open. pipefail keeps the step's
      # outcome tied to node's exit code rather than tee's.
      - name: run fast gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify.js 2>&1 | tee test/artifacts/stdout-fast.log
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-fast
          path: test/artifacts/
          if-no-files-found: error
      - name: fail if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1

  e2e:
    name: browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: cache chrome download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: install
        run: npm install --no-audit --no-fund
      - name: run browser gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/artifacts
          node scripts/verify-e2e.js 2>&1 | tee test/artifacts/stdout-e2e.log
      - name: upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-e2e
          path: test/artifacts/
          if-no-files-found: error
      - name: fail if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # ==========================================================================
  # 回写报告。这个 job 和 supercubegame/jumpwow 的同名 job 是同一份结构：
  # 一样的步骤、一样的 id、一样的中文步骤名。两边各写各的，几轮之后就会各自漂。
  #
  # 这里**故意没有** actions/checkout。run #51：两条闸门全绿，clone 死在 git
  # 证书校验（exit 128），把整条回写一起带走，那次提交上一条评论都没有。从仓库
  # 外面看像是「跑过了」。这个 job 要的是两个脚本文件，不是一棵工作树。
  #
  # 每一步都有稳定的 id，闸门按 id 定位它们,显示名是装饰，改名不该把断言弄哑。
  # 但显示名同时也被断言成精确值，所以在这个仓库里改名会立刻红。
  # ==========================================================================
  summary:
    name: report
    if: always()
    needs: [fast, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 下载闸门报告
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: reports
          pattern: report-*

      # 在任何会失败的步骤之前种下，每次都跑。这样「降级」这条支路是每一次运行
      # 都真的走过的，而不是一条从来没被执行过、需要的时候才发现是坏的分支。
      # composer 起来了就把它覆盖掉；下面的步骤靠 flag 文件区分手里拿的是哪一份。
      - name: 种下兜底评论
        id: seed
        shell: bash
        run: |
          set -uo pipefail
          touch report-degraded.flag
          {
            echo "⚠️ **报告降级** — composer 没能加载，所以这条评论只有 job 级别的"
            echo "结果，没有逐项证据。"
            echo ""
            echo "| 闸门 | job 结果 |"
            echo "| --- | --- |"
            echo "| fast gate | \`${{ needs.fast.result }}\` |"
            echo "| browser gate | \`${{ needs.e2e.result }}\` |"
            echo ""
            echo "提交 \`${GITHUB_SHA:0:7}\` · [完整日志]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > comment.md
          found=0
          while IFS= read -r log; do
            found=$((found + 1))
            {
              echo ""
              echo "<details><summary>$(basename "$log") 末尾 80 行</summary>"
              echo ""
              echo '```'
              tail -n 80 "$log"
              echo '```'
              echo ""
              echo "</details>"
            } >> comment.md
          done < <(find reports -name 'stdout-*.log' 2>/dev/null | sort)
          if [ "$found" -eq 0 ]; then
            printf '\n连闸门的 stdout 日志都没下载到，说明这次在闸门产出任何东西之前就断了 - 去看 workflow，不是看闸门。\n' >> comment.md
          fi

      # 两个文件走 HTTPS，而不是整仓 clone，并且 pin 在被测的那个 commit 上，
      # 保证 composer 和它正在汇报的代码是同一版。--retry-all-errors 覆盖的就是
      # 把 run #51 干掉的那一类偶发网络错误。
      #
      # scripts/package.json 是这里现写的：没有 checkout 就没有根 package.json，
      # node 会把这两个 ESM 文件当 CommonJS 解析。
      - name: 取 composer
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scripts/lib
          echo '{ "type": "module" }' > scripts/package.json
          for f in scripts/compose-report.js scripts/lib/report.js; do
            curl --fail --silent --show-error --location \
                 --retry 5 --retry-delay 3 --retry-all-errors \
                 --connect-timeout 10 --max-time 60 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 -o "$f" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$f?ref=$GITHUB_SHA"
            test -s "$f"
          done

      - name: 合成报告
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-report.js reports
          test -s comment.md
          rm -f report-degraded.flag

      # 这一步**不是** continue-on-error，也永远不许改成 continue-on-error：
      # 一个允许自己静默失败的回写，从外面看起来就是 run #51 的样子。
      - name: 回写报告
        id: post
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const marker = '<!-- image-grabber-verify -->';
            const degraded = fs.existsSync('report-degraded.flag');
            const text = fs.readFileSync('comment.md', 'utf8');
            const body = marker + '\n' + text;
            const { owner, repo } = context.repo;

            // 先写 job summary。就算下面每次尝试都失败，证据至少还留在 run
            // 页面上，人能看到。
            await core.summary.addRaw(text).write();

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            async function postOnce() {
              // 从 commit 反查 PR。不读 context.payload.pull_request：那要求
              // workflow 挂在 pull_request 事件上，而挂上去就会每次跑两遍。
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: context.sha
              });
              const open = associated.data.find(pr => pr.state === 'open');
              if (open) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: open.number, per_page: 100
                });
                const existing = comments.find(c => c.body && c.body.includes(marker));
                const result = existing
                  ? await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
                  : await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
                // 接口收下了不等于有人读得到这条评论，读回来确认一遍。
                const readback = await github.rest.issues.getComment({ owner, repo, comment_id: result.data.id });
                if (!readback.data.body.includes(marker)) throw new Error('PR 评论读回后没有标记');
                return `PR #${open.number}（评论 ${result.data.id}）`;
              }
              // 没有 PR 的那条支路。直接 push 到 main 时靠的就是它,而那正是
              // 没人盯着的时候。
              const result = await github.rest.repos.createCommitComment({
                owner, repo, commit_sha: context.sha, body
              });
              const readback = await github.rest.repos.getCommitComment({ owner, repo, comment_id: result.data.id });
              if (!readback.data.body.includes(marker)) throw new Error('commit 评论读回后没有标记');
              return `commit ${context.sha.slice(0, 7)}（评论 ${result.data.id}）`;
            }

            let posted = null;
            let last = null;
            for (let attempt = 1; attempt <= 4 && !posted; attempt += 1) {
              try {
                posted = await postOnce();
              } catch (err) {
                last = err;
                core.warning(`第 ${attempt} 次回写失败：${err.message}`);
                if (attempt < 4) await sleep(2000 * attempt);
              }
            }
            if (!posted) throw new Error(`重试 4 次仍然没能把报告写回去：${last && last.message}`);
            core.info(`报告已送达 ${posted}`);
            if (degraded) core.setFailed('报告是以降级形式送出的：composer 没加载，评论里只有 job 结果，没有逐项证据');

      # 判定从 job 结果算，所以 composer 没到位也照样成立。composer 在的时候
      # 再用 --check 复核一遍。
      - name: 闸门失败或报告降级则失败
        id: verdict
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for pair in "fast gate:${{ needs.fast.result }}" "browser gate:${{ needs.e2e.result }}"; do
            if [ "${pair##*:}" != "success" ]; then echo "${pair%%:*}: ${pair##*:}"; rc=1; fi
          done
          if [ -f report-degraded.flag ]; then
            echo "composer 没能加载，送出去的评论里没有逐项证据"
            rc=1
          fi
          if [ -f scripts/compose-report.js ]; then
            node scripts/compose-report.js reports --check || rc=1
          fi
          exit $rc
