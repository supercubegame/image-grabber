<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Grabber lazy gallery (endless)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  .item { display: block; width: 200px; height: 400px; object-fit: contain; background: #eee; }
  .sentinel { height: 120px; color: #888; }
</style>
</head>
<body>
<h1>lazy gallery (endless)</h1>
<!--
  Never runs out: 3 images on load, 2 more every time the bottom is reached,
  forever. This is the page the scroll cap and the total timeout exist for, and the
  one that proves an aborted run is reported as end-NOT-confirmed instead of as a
  clean sweep.
-->
<div id="items"></div>
<div class="sentinel" id="sentinel">loading more...</div>
<script>
  var BATCH_SIZE = 2;
  var LOAD_DELAY_MS = 100;
  var loading = false;
  var served = 0;

  window.__FIXTURE__ = { kind: 'endless', batches: 0, images: 0, failed: false };

  function add(count) {
    var box = document.getElementById('items');
    for (var i = 0; i < count; i++) {
      served++;
      var img = document.createElement('img');
      img.className = 'item';
      img.src = 'img/' + (300 + served) + 'x' + (200 + served) + '.png';
      img.alt = 'endless ' + served;
      box.appendChild(img);
    }
    window.__FIXTURE__.images = document.images.length;
  }

  function nearBottom() {
    return window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 150;
  }

  window.addEventListener('scroll', function () {
    if (loading || !nearBottom()) return;
    loading = true;
    setTimeout(function () {
      window.__FIXTURE__.batches++;
      add(BATCH_SIZE);
      loading = false;
    }, LOAD_DELAY_MS);
  });

  add(3);
</script>
</body>
</html>
